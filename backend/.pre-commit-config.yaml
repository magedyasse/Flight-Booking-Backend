
repos:
  # Code quality: linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.7
    hooks:
      - id: ruff-check
        args: [--fix]

      - id: ruff-format

  # Automated testing
  - repo: https://github.com/christophmeissner/pytest-pre-commit
    rev: 1.0.0
    hooks:
      - id: pytest
        entry: bash -c 'PYTHONPATH=. pytest'
        language: system
        pass_filenames: false
        always_run: true
